<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thunes lab: assets</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #23252c;
        color: #e8e8ee;
        font: 13px/1.4 system-ui, sans-serif;
      }
      body {
        display: grid;
        grid-template-columns: 340px 1fr;
      }
      aside {
        padding: 12px;
        overflow: auto;
        border-right: 1px solid #3a3d47;
      }
      h2 {
        font-size: 12px;
        margin: 14px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #9aa0b4;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: 1px 0;
      }
      li small {
        color: #9aa0b4;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li.problem {
        color: #ffb4a8;
        display: block;
      }
      button {
        font: inherit;
        padding: 0 6px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!--
      Dev-only page for the asset pipeline: lists library files and uploads,
      uploads files through the registry, and renders contact sheets of
      character × dance pairs. Driven by scripts/e2e/assets.mjs through
      window.__thunes.lab (see assets.ts).
    -->
    <aside>
      <input id="files" type="file" multiple />
      <div id="status"></div>
      <h2>Report</h2>
      <ul id="report"></ul>
      <h2>Characters</h2>
      <ul id="characters"></ul>
      <h2>Dances</h2>
      <ul id="dances"></ul>
      <h2>Songs</h2>
      <ul id="songs"></ul>
    </aside>
    <canvas id="view"></canvas>
    <script type="module" src="./assets.ts"></script>
  </body>
</html>
