<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thunes lab: dances</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #3b3e48;
        overflow: hidden;
        font: 13px/1.4 system-ui, sans-serif;
        color: #e8e8ee;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #label {
        position: fixed;
        left: 10px;
        top: 8px;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <!--
      Dev-only player for the built-in dances.
        ?dance=groove            slug of a builtin dance id (default: groove)
        ?character=mannequin     slug of a builtin character id (default: mannequin)
        ?view=front|three|side|back   camera heading (default: three)
        ?beat=2.5                freeze on this beat instead of playing
        ?speed=1                 playback rate
        ?sheet=1                 contact sheet: `count` evenly spaced frames of the loop (default 8),
                                 front view above side view. &from=0&to=4 limits the beat range.
        ?skeleton=1              draw the bones on top
    -->
    <canvas id="view"></canvas>
    <div id="label"></div>
    <script type="module" src="./dances.ts"></script>
  </body>
</html>
